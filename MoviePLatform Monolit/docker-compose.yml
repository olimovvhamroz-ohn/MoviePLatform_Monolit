version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: movieplatform_db
    environment:
      POSTGRES_DB: MoviePlatformDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10110
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
